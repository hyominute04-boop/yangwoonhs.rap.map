<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>과학실 수납장 지도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F5F8FC;
  --surface:#FFFFFF;
  --surface-alt:#EAF2FF;
  --border:#D9E2EC;
  --border-subtle:#E8EEF5;
  --text:#172B4D;
  --text-sub:#3D4F6B;
  --text-muted:#64748B;
  --label:#172B4D;
  --accent:#2563EB;
  --accent-strong:#173B67;
  --accent-contrast:#FFFFFF;
  --accent-soft:#EAF2FF;
  --hazard:#D97706;
  --hazard-soft:#FFFBEB;
  --danger:#EF4444;
  --danger-soft:#FEF2F2;
  --success:#16A34A;
  --success-soft:#EAF7EE;
  --success-border:#A7E3C4;
  --success-hover-soft:#DDF5E6;
  --icon-muted:#94A3B8;
  --shadow: 0 1px 3px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.04);
  --shadow-lg: 0 10px 20px -5px rgba(16,24,40,.10), 0 4px 8px -4px rgba(16,24,40,.06);

  --tone-a-soft:#EAF2FF; --tone-a-text:#2563EB;
  --tone-b-soft:#EAFBF1; --tone-b-text:#16A34A;
  --tone-c-soft:#F4F0FF; --tone-c-text:#7C3AED;
  --tone-d-soft:#F1F5F9; --tone-d-text:#475569;

  --sidebar-bg:#173B67;
  --sidebar-bg-alt:#1F4A7A;
  --sidebar-active-bg:#2A5C94;
  --sidebar-text:#F3F7FC;
  --sidebar-text-muted:#9FB6D6;
  --sidebar-border: rgba(255,255,255,.10);
  --sidebar-icon-muted:#B7C9E4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1622;
    --surface:#111E30;
    --surface-alt:#16283F;
    --border:#28405F;
    --border-subtle:#1B2C42;
    --text:#EAF1FB;
    --text-sub:#B7C6DC;
    --text-muted:#7E93B0;
    --label:#EAF1FB;
    --accent:#5B9BF7;
    --accent-strong:#8FBBFA;
    --accent-contrast:#0B1622;
    --accent-soft:#193356;
    --hazard:#FBBF24;
    --hazard-soft:#3F2D0E;
    --danger:#F87171;
    --danger-soft:#450A0A;
    --success:#4ADE80;
    --success-soft:#123625;
    --success-border:#1F5A3A;
    --success-hover-soft:#16432B;
    --icon-muted:#7E93B0;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px -10px rgba(0,0,0,.5);
    --shadow-lg: 0 10px 20px -5px rgba(0,0,0,.5), 0 6px 10px -6px rgba(0,0,0,.4);

    --tone-a-soft:#193356; --tone-a-text:#8FBBFA;
    --tone-b-soft:#123625; --tone-b-text:#4ADE80;
    --tone-c-soft:#2C2050; --tone-c-text:#C4B5FD;
    --tone-d-soft:#1E293B; --tone-d-text:#CBD5E1;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1622;
  --surface:#111E30;
  --surface-alt:#16283F;
  --border:#28405F;
  --border-subtle:#1B2C42;
  --text:#EAF1FB;
  --text-sub:#B7C6DC;
  --text-muted:#7E93B0;
  --label:#EAF1FB;
  --accent:#5B9BF7;
  --accent-strong:#8FBBFA;
  --accent-contrast:#0B1622;
  --accent-soft:#193356;
  --hazard:#FBBF24;
  --hazard-soft:#3F2D0E;
  --danger:#F87171;
  --danger-soft:#450A0A;
  --success:#4ADE80;
  --success-soft:#123625;
  --success-border:#1F5A3A;
  --success-hover-soft:#16432B;
  --icon-muted:#7E93B0;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px -10px rgba(0,0,0,.5);
  --shadow-lg: 0 10px 20px -5px rgba(0,0,0,.5), 0 6px 10px -6px rgba(0,0,0,.4);

  --tone-a-soft:#193356; --tone-a-text:#8FBBFA;
  --tone-b-soft:#123625; --tone-b-text:#4ADE80;
  --tone-c-soft:#2C2050; --tone-c-text:#C4B5FD;
  --tone-d-soft:#1E293B; --tone-d-text:#CBD5E1;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Pretendard","IBM Plex Sans KR",-apple-system,"Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono","JetBrains Mono","IBM Plex Sans KR",monospace;font-variant-numeric:tabular-nums;}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.app{
  display:flex;
  min-height:100vh;
  max-width:1320px;
  margin:0 auto;
}
.sidebar{
  width:264px;
  flex-shrink:0;
  padding:26px 16px;
  display:flex;
  flex-direction:column;
  gap:2px;
  background:var(--sidebar-bg);
}
.brand{
  padding:4px 6px;
  display:flex;
  flex-direction:row;
  align-items:center;
  gap:11px;
  margin-bottom:22px;
}
.brand-mark{
  width:38px;height:38px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:#fff;border-radius:9px;padding:4px;
  border:none;
}
.brand-mark img{width:100%;height:100%;object-fit:contain;display:block;}
.brand-text{display:flex;flex-direction:column;gap:2px;min-width:0;}
.brand-name{font-size:15.5px;font-weight:700;letter-spacing:-.01em;color:var(--sidebar-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand-sub{font-size:11.5px;color:var(--sidebar-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.navlist{display:flex;flex-direction:column;gap:3px;}
.nav-section-label{
  font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--sidebar-text-muted);
  text-transform:uppercase;padding:16px 12px 4px;
}
.navbtn{
  position:relative;
  display:flex;align-items:center;gap:11px;
  height:40px;padding:0 12px;border-radius:9px;border:none;background:none;
  font-size:14.5px;font-weight:500;text-align:left;cursor:pointer;
  transition:background .12s, color .12s;
}
.navbtn .ic{
  width:19px;height:19px;flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;
  transition:color .12s;
}
.navbtn .ic svg{width:100%;height:100%;display:block;}

/* sidebar (dark navy) nav buttons */
.sidebar .navbtn{color:var(--sidebar-text-muted);}
.sidebar .navbtn .ic{color:var(--sidebar-icon-muted);}
.sidebar .navbtn .ic.hazard-ic{color:#FBBF24;}
.sidebar .navbtn:hover{background:rgba(255,255,255,.08);color:var(--sidebar-text);}
.sidebar .navbtn:hover .ic:not(.hazard-ic){color:var(--sidebar-text);}
.sidebar .navbtn.active{background:var(--sidebar-active-bg);color:#fff;font-weight:600;}
.sidebar .navbtn.active .ic:not(.hazard-ic){color:#fff;}
.sidebar .navbtn.hazardnav{color:#FDBA74;}
.sidebar .navbtn.hazardnav::after{
  content:"";position:absolute;top:10px;right:11px;width:6px;height:6px;
  border-radius:50%;background:#FBBF24;
}

/* mobile tab bar (light, sits in main content area) */
.mobile-tabs .navbtn{color:var(--text-sub);height:36px;}
.mobile-tabs .navbtn .ic{color:var(--icon-muted);}
.mobile-tabs .navbtn .ic.hazard-ic{color:var(--hazard);}
.mobile-tabs .navbtn:hover{background:var(--surface-alt);color:var(--text);}
.mobile-tabs .navbtn:hover .ic:not(.hazard-ic){color:var(--text);}
.mobile-tabs .navbtn.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.mobile-tabs .navbtn.active .ic:not(.hazard-ic){color:var(--accent);}
.mobile-tabs .navbtn.hazardnav{color:var(--hazard);}
.mobile-tabs .navbtn.hazardnav::after{
  content:"";position:absolute;top:8px;right:9px;width:6px;height:6px;
  border-radius:50%;background:var(--hazard);
}

.side-stats{
  margin-top:auto;
  padding:13px 13px;
  background:var(--sidebar-bg-alt);
  border-radius:11px;
  font-size:12.5px;
  color:var(--sidebar-text-muted);
  display:flex;flex-direction:column;gap:5px;
}
.side-stats b{color:#fff;font-family:"IBM Plex Mono";font-weight:600;}
.side-tip{
  margin-top:10px;padding:10px 13px;border-radius:9px;
  background:var(--sidebar-bg-alt);color:var(--sidebar-text-muted);
  font-size:11.5px;font-weight:500;text-align:center;line-height:1.45;
}

.main{
  flex:1;
  min-width:0;
  padding:24px 28px 60px;
  display:flex;
  flex-direction:column;
  gap:18px;
}
.mobile-tabs{display:none;}

.searchbar{
  display:flex;gap:0;align-items:stretch;
  height:40px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  box-shadow:var(--shadow);
  transition:box-shadow .12s, border-color .12s;
}
.searchbar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.15);}
.searchbar .ic{color:var(--text-muted);width:16px;height:16px;flex-shrink:0;margin:0 4px 0 14px;align-self:center;}
.searchbar .ic svg{width:100%;height:100%;display:block;}
.searchbar input{
  flex:1;border:none;background:none;outline:none;color:var(--text);
  font-size:14px;font-family:inherit;min-width:0;
}
.searchbar input::placeholder{color:var(--text-muted);}
.loc-pill-select{
  border:none;border-left:1px solid var(--border);
  background:none;
  color:var(--text-sub);
  border-radius:0 8px 8px 0;
  font-size:12.5px;
  padding:0 14px;
  font-family:inherit;
}

h1.page-title{font-size:20px;font-weight:600;margin:0;letter-spacing:-.02em;}
.page-sub{font-size:13px;color:var(--text-sub);margin:2px 0 0;}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;}

.page-hero{
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:6px 2px 4px;
  background:transparent;
  border:none;
}
.page-hero.hazard{background:transparent;}
.page-hero-icon{
  width:54px;height:54px;flex-shrink:0;border-radius:14px;
  background:var(--accent-soft);
  display:flex;align-items:center;justify-content:center;
  color:var(--accent);
  position:relative;z-index:1;
}
.page-hero-icon svg{width:27px;height:27px;display:block;}
.page-hero.hazard .page-hero-icon{background:var(--hazard-soft);color:var(--hazard);}
.page-hero-text{flex:1;min-width:200px;position:relative;z-index:1;}
.page-hero .page-title{font-size:22px;font-weight:700;color:var(--accent-strong);}
.page-hero.hazard .page-title{color:var(--text);}
.page-hero .page-sub{margin-top:4px;}
.page-hero-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex-shrink:0;position:relative;z-index:1;}
.meta-pill{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--border);background:var(--surface);
  color:var(--text-sub);font-size:12px;font-weight:600;
  padding:6px 12px;border-radius:999px;white-space:nowrap;
}
.meta-pill .ic{width:13px;height:13px;display:inline-flex;color:var(--text-muted);flex-shrink:0;}
.meta-pill .ic svg{width:100%;height:100%;display:block;}
.page-hero-deco{
  position:absolute;right:6px;top:50%;transform:translateY(-50%) rotate(-8deg);
  font-size:56px;opacity:.12;pointer-events:none;line-height:1;
  display:none;
}
@media (min-width:640px){ .page-hero-deco{display:block;} }

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  box-shadow:var(--shadow);
}

/* search results */
.result-list{display:flex;flex-direction:column;}
.result-row{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;
  border-bottom:1px solid var(--border-subtle);
  flex-wrap:wrap;
}
.result-row:last-child{border-bottom:none;}
.badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:600;
  padding:3px 8px;border-radius:6px;
  background:var(--accent-soft);color:var(--accent);
  white-space:nowrap;
}
.badge.hazard{background:var(--hazard-soft);color:var(--hazard);}
.badge-link{display:inline-flex;gap:4px;border:none;background:none;padding:0;margin:0;cursor:pointer;font:inherit;}
.badge-link:hover .badge{filter:brightness(0.94);}
.badge.num{font-family:"IBM Plex Mono";background:var(--surface-alt);color:var(--text);}
.badge.example{background:var(--surface-alt);color:var(--text-muted);font-weight:500;}
.result-name{font-weight:600;font-size:14.5px;flex-shrink:0;}
.result-note{color:var(--text-muted);font-size:13px;}
.result-spacer{flex:1;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--border);
  background:var(--surface-alt);
  color:var(--text);
  font-size:13px;font-weight:600;
  padding:7px 13px;border-radius:7px;
  cursor:pointer;
  text-decoration:none;
  transition:background .12s,border-color .12s;
  white-space:nowrap;
}
.btn:hover{background:var(--border);}
.btn.primary{background:var(--accent);color:var(--accent-contrast);border-color:transparent;}
.btn.primary:hover{background:var(--accent-strong);}
.btn.danger-ghost{color:var(--danger);}
.btn.danger-ghost:hover{background:var(--danger-soft);border-color:var(--danger-soft);}
.btn.sm{padding:5px 9px;font-size:12px;}
.empty-state{padding:44px 20px;text-align:center;color:var(--text-muted);font-size:14px;}
.empty-state .ic{font-size:26px;display:block;margin-bottom:8px;}
.empty-state .btn{margin-top:12px;}

.jumpbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--border);}
.jumpbox input{
  width:220px;max-width:100%;border:1px solid var(--border);background:var(--surface);
  border-radius:7px;padding:8px 12px;font-family:inherit;font-size:13.5px;color:var(--text);
}
.jumpbox span{font-size:12px;color:var(--text-muted);}

/* cabinet list (per-location page) */
.cab-list{display:flex;flex-direction:column;}
.cab-row{display:flex;border-bottom:1px solid var(--border);}
.cab-row:last-child{border-bottom:none;}
.cab-num-cell{
  width:66px;flex-shrink:0;padding:14px 8px;
  background:var(--surface-alt);color:var(--text);
  font-family:"IBM Plex Mono";font-weight:700;font-size:16px;
  display:flex;align-items:flex-start;justify-content:center;
  border-right:1px solid var(--border);
}
.cab-row.hazard .cab-num-cell{color:var(--hazard);}
.cab-items-cell{flex:1;min-width:0;padding:10px 12px;display:flex;flex-direction:column;gap:10px;}
.cab-empty-note{color:var(--text-muted);font-size:12.5px;padding:4px 0;}

.cab-tables{display:flex;flex-wrap:wrap;gap:6px 0;}
.cab-table-col{flex:1 1 210px;min-width:190px;padding:0 18px;}
.cab-table-col:not(:last-child){border-right:1px solid var(--border);}
.cab-table{width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.5;}
.cab-table th{text-align:left;font-size:10.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.02em;padding:3px 6px;border-bottom:1px solid var(--border-subtle);white-space:nowrap;}
.cab-table td{padding:6px 6px;border-bottom:1px solid var(--border-subtle);vertical-align:middle;}
.cab-table tbody tr:last-child td{border-bottom:none;}
.cab-table .cab-serial{font-family:"IBM Plex Mono";color:var(--text-muted);width:1%;white-space:nowrap;text-align:center;font-size:11px;}
.cab-table .cab-item-name{font-weight:600;color:var(--text);}
.cab-table .cab-item-note{display:block;font-weight:400;color:var(--text-muted);font-size:12px;}
.cab-table .cab-item-name .badge.example{margin-left:4px;padding:2px 6px;font-size:10px;}
.cab-table th:nth-child(3){text-align:right;}
.cab-table td.cab-qty-cell{width:1%;white-space:nowrap;text-align:right;}
.cab-table th:nth-child(4),.cab-table td:nth-child(4){width:1%;white-space:nowrap;text-align:center;}
.qty-stepper{
  display:inline-flex;align-items:stretch;
  border:1px solid var(--border);border-radius:8px;overflow:hidden;
}
.qty-step-btn{
  width:26px;flex-shrink:0;border-radius:0;
  border:none;background:var(--surface);color:var(--text-sub);
  cursor:pointer;font-size:13px;line-height:1;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;
}
.qty-step-btn:hover{background:var(--accent-soft);color:var(--accent);}
.cab-qty-input{
  width:38px;font-family:"IBM Plex Mono";text-align:center;
  border:none;border-left:1px solid var(--border);border-right:1px solid var(--border);
  border-radius:0;padding:3px 2px;
  background:var(--surface);color:var(--text);font-size:14.5px;font-weight:700;
}
.cab-qty-input:focus{outline:none;background:var(--accent-soft);}
.cab-qty-unknown{color:var(--text-muted);font-size:12px;white-space:nowrap;}
.cab-del-btn{
  border:none;background:none;color:var(--text-muted);cursor:pointer;font-size:13px;line-height:1;
  opacity:.35;transition:opacity .12s,background .12s,color .12s;
  width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
}
.cab-del-btn:hover{background:var(--danger-soft);color:var(--danger);opacity:1;}
.cab-table tbody tr:hover .cab-del-btn{opacity:1;}

/* 약품장 diagram */
.chem-diagram-wrap{padding:20px 20px 22px;}
.chem-diagram-title{font-size:17px;font-weight:700;margin:0 0 4px;color:var(--accent-strong);}
.chem-diagram-sub{font-size:13px;color:var(--text-muted);margin:0 0 16px;}
.chem-diagram{display:flex;gap:18px;flex-wrap:wrap;}
.chem-cabinet{flex:1 1 340px;min-width:280px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface);}
.chem-cabinet-title{padding:9px 14px;font-weight:700;font-size:13.5px;color:#fff;}
.chem-cabinet.c1 .chem-cabinet-title{background:#1E293B;}
.chem-cabinet.c2 .chem-cabinet-title{background:#064E3B;}
.chem-tier{display:flex;border-top:1px solid var(--border);}
.chem-tier-label{
  width:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:11.5px;font-weight:700;color:var(--text-muted);background:var(--surface-alt);
  border-right:1px solid var(--border);padding:4px;line-height:1.3;
}
.chem-tier-rows{flex:1;display:flex;flex-direction:column;min-width:0;}
.chem-shelf-row{display:flex;align-items:stretch;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
.chem-tier-rows .chem-shelf-row:last-child{border-bottom:none;}
.chem-shelf-code{
  width:70px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-family:"IBM Plex Mono";font-size:12.5px;font-weight:700;color:var(--text-muted);
  background:var(--surface-alt);border-right:1px solid var(--border);padding:5px 2px;text-align:center;
}
.chem-count{
  display:inline-block;background:var(--accent);color:var(--accent-contrast);
  border-radius:999px;font-size:10px;font-weight:700;padding:1px 6px;font-family:"IBM Plex Sans KR";
}
.chem-shelf-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:5px 10px;}
.chem-cats-empty{
  font-size:11.5px;line-height:1.35;color:var(--text-muted);text-align:left;
}
.chem-cats-mini{
  font-size:9.5px;line-height:1.3;color:var(--text-muted);opacity:.85;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.chem-shelf-items{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:1px 8px;min-width:0;
}
.chem-shelf-item{
  font-size:11px;line-height:1.4;font-weight:600;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}
.chem-shelf-item-qty{color:var(--text-muted);font-weight:500;margin-left:3px;}
.chem-shelf-row:hover{background:var(--surface-alt);}
.chem-shelf-row.has-items .chem-shelf-code{color:var(--accent-strong);}
.chem-shelf-row.highlight{background:var(--hazard-soft);box-shadow:inset 0 0 0 1.5px var(--hazard);}
.chem-shelf-row.highlight .chem-shelf-code{color:var(--hazard);}
.chem-grid-hint{
  display:flex;align-items:center;gap:10px;justify-content:center;
  padding:20px;border-radius:12px;background:var(--surface-alt);color:var(--text-muted);
  font-size:13px;font-weight:500;text-align:center;
}
.chem-grid-hint svg{width:20px;height:20px;flex-shrink:0;color:var(--text-muted);}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--surface-alt);border:1px solid var(--border);
  border-radius:8px;padding:6px 6px 6px 12px;font-size:13.5px;
}
.chip.example{opacity:.85;}
.chip.hazard{background:var(--hazard-soft);border-color:transparent;}
.chip-name{font-weight:600;white-space:nowrap;}
.chip-qty{color:var(--text-muted);white-space:nowrap;}
.chip-note{color:var(--text-muted);font-size:12px;white-space:nowrap;}
.chip .badge.example{padding:2px 6px;font-size:10.5px;}
.chip-btn{
  border:none;background:var(--surface);color:var(--text-muted);
  width:22px;height:22px;flex-shrink:0;border-radius:50%;cursor:pointer;font-size:13px;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;
}
.chip-btn:hover{background:var(--border);color:var(--text);}
.chip-btn.del:hover{background:var(--danger-soft);color:var(--danger);}

.cab-add-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;margin-top:10px;
  border:1.5px dashed var(--success-border);background:var(--success-soft);color:var(--success);
  border-radius:9px;padding:12px 14px;font-size:13.5px;font-weight:700;cursor:pointer;text-align:center;
  transition:background .12s,border-color .12s;
}
.cab-add-btn svg{width:15px;height:15px;display:block;}
.cab-add-btn:hover{border-color:var(--success);background:var(--success-hover-soft);}

.page-footer-action{padding:14px 16px;border-top:1px solid var(--border);}

/* cabinet card head (per-location page) */
.cab-card-head{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:16px 18px;border-bottom:1px solid var(--border);
}
.cab-card-icon{
  width:40px;height:40px;flex-shrink:0;border-radius:10px;
  background:var(--accent-soft);color:var(--accent-strong);
  display:flex;align-items:center;justify-content:center;
}
.cab-card-icon svg{width:20px;height:20px;display:block;}
.cab-card-head.hazard .cab-card-icon{background:var(--hazard-soft);color:var(--hazard);}
.cab-card-head-text{flex:1;min-width:170px;}
.cab-card-title{font-size:15.5px;font-weight:700;margin:0;}
.cab-card-sub{font-size:12px;color:var(--text-muted);margin:3px 0 0;}
.cab-jumpbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.cab-jumpbox input{
  width:190px;max-width:100%;border:1px solid var(--border);background:var(--surface);
  border-radius:8px;padding:8px 12px;font-family:inherit;font-size:13.5px;color:var(--text);
}

/* cabinet picker chips */
.cab-picker{display:flex;flex-wrap:wrap;gap:8px;padding:16px 18px;border-bottom:1px solid var(--border);}
.cab-chip{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  min-width:58px;padding:9px 10px;border-radius:10px;
  border:1px solid var(--border);background:var(--surface-alt);color:var(--text);
  cursor:pointer;font-family:inherit;
}
.cab-chip:hover{border-color:var(--accent);}
.cab-chip.active{background:var(--accent);color:var(--accent-contrast);border-color:transparent;}
.cab-chip.hazard.active{background:var(--hazard);color:#fff;}
.cab-chip-num{font-family:"IBM Plex Mono";font-weight:700;font-size:14px;white-space:nowrap;}
.cab-chip-count{font-size:10px;opacity:.8;white-space:nowrap;}
.cab-picker-empty{padding:32px 20px;text-align:center;color:var(--text-muted);font-size:13.5px;}

/* search + filter card */
.search-card{padding:16px 18px;display:flex;flex-direction:column;gap:12px;}
.search-row{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;}
.search-input-wrap{
  flex:1;min-width:220px;display:flex;align-items:center;gap:10px;
  height:46px;padding:0 16px;border:1px solid var(--border);border-radius:10px;
  background:var(--bg);transition:border-color .12s,box-shadow .12s;
}
.search-input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.15);}
.search-input-wrap .ic{width:18px;height:18px;flex-shrink:0;color:var(--text-muted);}
.search-input-wrap .ic svg{width:100%;height:100%;display:block;}
.search-input-wrap input{
  flex:1;min-width:0;border:none;background:none;outline:none;color:var(--text);
  font-size:14.5px;font-family:inherit;
}
.search-input-wrap input::placeholder{color:var(--text-muted);}
.search-btn{height:46px;padding:0 22px;font-size:14px;border-radius:10px;flex-shrink:0;}
.search-btn svg{width:16px;height:16px;display:block;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;}
.filter-chip{
  border:1px solid var(--border);background:var(--surface);color:var(--text-sub);
  font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;
  transition:background .12s,border-color .12s,color .12s;
}
.filter-chip:hover{background:var(--surface-alt);}
.filter-chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

/* cabinet cards */
.cab-cards-list{display:flex;flex-direction:column;gap:16px;}
.cab-card{
  background:var(--surface);border-radius:14px;box-shadow:var(--shadow);
  overflow:hidden;
}
.cab-card-topbar{display:flex;justify-content:flex-end;padding:10px 14px 0;}
.cab-settings-btn{
  display:inline-flex;align-items:center;gap:5px;
  border:1px solid var(--border);background:var(--surface);color:var(--text-muted);
  font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:7px;cursor:pointer;
}
.cab-settings-btn svg{width:12px;height:12px;display:block;}
.cab-settings-btn:hover{background:var(--surface-alt);color:var(--text-sub);}
.cab-card-inner{display:flex;flex-wrap:wrap;}
.cab-card-info{
  flex:0 0 190px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  padding:20px;margin:16px;border-radius:12px;
  background:var(--tone-a-soft);color:var(--tone-a-text);
}
.cab-card-info.tone-a{background:var(--tone-a-soft);color:var(--tone-a-text);}
.cab-card-info.tone-b{background:var(--tone-b-soft);color:var(--tone-b-text);}
.cab-card-info.tone-c{background:var(--tone-c-soft);color:var(--tone-c-text);}
.cab-card-info.tone-d{background:var(--tone-d-soft);color:var(--tone-d-text);}
.cab-card-info.hazard{background:var(--hazard-soft);color:var(--hazard);}
.cab-card-info-icon{width:26px;height:26px;display:flex;align-items:center;justify-content:center;}
.cab-card-info-icon svg{width:100%;height:100%;display:block;}
.cab-card-info-label{font-size:12.5px;font-weight:600;opacity:.85;}
.cab-card-info-num{font-family:"IBM Plex Mono";font-size:26px;font-weight:700;line-height:1.15;}
.cab-card-info-divider{width:100%;height:1px;background:currentColor;opacity:.18;margin:2px 0;}
.cab-card-info-row{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;opacity:.9;}
.cab-card-info-row .ic{width:14px;height:14px;display:inline-flex;flex-shrink:0;}
.cab-card-info-row .ic svg{width:100%;height:100%;display:block;}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--text-muted);flex-shrink:0;}
.status-dot.on{background:var(--success);}
.cab-detail-cats{font-size:10.5px;opacity:.9;line-height:1.6;display:flex;flex-wrap:wrap;gap:4px;}
.cab-detail-cats-edit{width:100%;margin-top:2px;display:flex;flex-direction:column;gap:6px;}
.cat-chip-static{
  display:inline-flex;align-items:center;
  background:rgba(255,255,255,.55);border-radius:6px;padding:3px 7px;font-weight:600;
}
.cat-chip-row{display:flex;flex-wrap:wrap;gap:4px;}
.cat-chip{
  display:inline-flex;align-items:center;gap:2px;
  background:var(--surface);color:var(--text);
  border:1px solid var(--border-subtle);
  border-radius:6px;padding:3px 5px 3px 9px;font-size:10.5px;font-weight:600;
  line-height:1.3;opacity:1;
}
.cat-chip-del{
  border:none;background:none;color:var(--text-muted);cursor:pointer;
  font-size:13px;line-height:1;padding:1px 3px;border-radius:50%;
}
.cat-chip-del:hover{color:var(--danger);background:var(--danger-soft);}
.cat-add-form{display:flex;gap:4px;width:100%;}
.cat-add-input{
  flex:1;min-width:0;border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:8px;padding:5px 8px;font-family:inherit;font-size:11px;
}
.cat-add-btn{
  display:inline-flex;align-items:center;gap:3px;white-space:nowrap;
  border:none;background:var(--surface);color:var(--accent-strong);
  border-radius:8px;padding:5px 9px;font-size:11px;font-weight:700;cursor:pointer;
}
.cat-add-btn svg{width:11px;height:11px;display:block;}
.cat-add-btn:hover{background:var(--accent);color:#fff;}
.cab-card-info.hazard .cat-add-btn{color:var(--hazard);}
.cab-card-info.hazard .cat-add-btn:hover{background:var(--hazard);color:#fff;}
.cab-card-body{flex:1;min-width:280px;padding:16px 20px 20px 4px;}

/* new cabinet / empty-first-item box */
.new-cab-box{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  text-align:center;padding:28px 20px;border-radius:14px;
  border:1.5px dashed var(--border);background:var(--surface-alt);cursor:pointer;
  transition:background .12s,border-color .12s;
}
.new-cab-box:hover{background:var(--accent-soft);border-color:var(--accent);}
.new-cab-icon{
  width:36px;height:36px;border-radius:50%;
  background:var(--surface);color:var(--accent);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;
}
.new-cab-icon svg{width:18px;height:18px;display:block;}
.new-cab-title{font-size:14.5px;font-weight:700;color:var(--text);margin-top:4px;}
.new-cab-sub{font-size:12.5px;color:var(--text-muted);}

/* forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field.full{grid-column:1 / -1;}
.field label{font-size:12.5px;font-weight:600;color:var(--label);}
.field input,.field select,.field textarea{
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:8px;padding:10px 11px;font-size:14.5px;font-family:inherit;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
.field .hint{font-size:11.5px;color:var(--text-muted);}
.form-actions{grid-column:1/-1;display:flex;gap:10px;align-items:center;padding-top:4px;}
.inline-msg{font-size:13px;color:var(--accent-strong);font-weight:600;}

.hazard-note{
  margin:0 20px 0;background:var(--hazard-soft);color:var(--hazard);
  border-radius:8px;padding:10px 14px;font-size:12.5px;font-weight:500;
  display:flex;gap:8px;align-items:flex-start;
}

/* import */
.method-tabs{display:flex;gap:6px;padding:16px 20px 0;}
.method-tab{
  border:1px solid var(--border);background:var(--surface-alt);color:var(--text-muted);
  font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;
  border-bottom:none;
}
.method-tab.active{background:var(--surface);color:var(--accent-strong);}
.import-body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px;}
.steps{margin:0;padding:0 0 0 20px;display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--text);}
.steps li{padding-left:4px;}
.steps li::marker{color:var(--text-muted);font-weight:600;}
.dropzone{
  border:1.5px dashed var(--border);border-radius:10px;padding:22px;text-align:center;
  color:var(--text-muted);font-size:13.5px;background:var(--surface-alt);
}
.dropzone input[type=file]{margin-top:10px;}
textarea.raw{width:100%;min-height:120px;resize:vertical;}
.preview-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.preview-table th{text-align:left;font-size:11.5px;color:var(--text-muted);padding:6px 8px;border-bottom:1px solid var(--border);}
.preview-table td{padding:5px 6px;border-bottom:1px solid var(--border);}
.preview-table input,.preview-table select{width:100%;border:1px solid transparent;border-radius:6px;padding:6px 7px;background:var(--surface);color:var(--text);font-size:13px;font-family:inherit;transition:border-color .12s;}
.preview-table input:focus,.preview-table select:focus{border-color:var(--accent);outline:none;}
.preview-table input:hover,.preview-table select:hover{border-color:var(--border);}
.preview-table input.num-col{font-family:"IBM Plex Mono";width:64px;}
.preview-table input.qty-col{font-family:"IBM Plex Mono";width:64px;}
.preview-table input.qty-col::placeholder{color:var(--text-muted);}
.preview-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;}
.parse-fail{background:var(--hazard-soft);color:var(--hazard);border-radius:8px;padding:10px 12px;font-size:12.5px;}

.footnote{font-size:11.5px;color:var(--text-muted);padding:0 4px;line-height:1.6;}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);
  background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:500;
  display:flex;gap:12px;align-items:center;box-shadow:var(--shadow-lg);
  opacity:0;pointer-events:none;transition:opacity .18s, transform .18s;z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
.toast button{background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;font-size:13.5px;}

.example-banner{
  display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;
  background:var(--accent-soft);border:1px solid var(--border-subtle);border-radius:10px;
  padding:10px 14px;font-size:12.5px;color:var(--text-sub);
}

[hidden]{display:none!important;}

@media (max-width: 780px){
  .app{flex-direction:column;max-width:100%;}
  .sidebar{display:none;}
  .mobile-tabs{
    display:flex;gap:4px;overflow-x:auto;padding:12px 14px 0;
    border-bottom:1px solid var(--border);
  }
  .mobile-tabs .navbtn{flex-shrink:0;}
  .main{padding:16px 14px 48px;}
  .form-grid{grid-template-columns:1fr;padding:16px;}
  .brand{display:none;}
  .cab-num-cell{width:52px;font-size:14px;}
  .search-row{flex-direction:column;}
  .search-input-wrap{flex:none;}
  .search-btn{width:100%;}
  .cab-card-inner{flex-direction:column;}
  .cab-card-info{margin:16px;flex:0 0 auto;width:auto;}
  .page-hero{flex-direction:column;align-items:flex-start;}
  .page-hero-meta{width:100%;}
}
</style>
</head>

      <input id="searchInput" type="text" placeholder="물품 이름으로 찾기 (예: 비커, 알코올램프, 염산…)" autocomplete="off">

</div>

function chemShelfByCode(code){
  for(var i=0;i<CHEM_SHELVES.length;i++){ if(CHEM_SHELVES[i].code===code) return CHEM_SHELVES[i]; }
  return null;
}
function chemMatchesQuery(shelf, locId, qRaw){
  var q = String(qRaw||"").trim();
  if(!q) return false;
  var norm = q.replace(/[\s\-]/g,"").toLowerCase();
  if(shelf.code.replace(/[\s\-]/g,"").toLowerCase().indexOf(norm)>-1) return true;
  var items = itemsFor(locId).filter(function(it){ return it.cabinet===shelf.code; });
  return items.some(function(it){ return it.name.toLowerCase().indexOf(q.toLowerCase())>-1; });
}

/* ---------- 서버(Supabase) 와 연결되는 공유 상태 ----------
   localStorage 저장 대신, 모든 데이터는 Supabase(Postgres)에 저장되고
   getState() 호출로 최신 내용을 받아옵니다. 다른 사람의 변경사항은
   Realtime 구독으로 거의 즉시 반영됩니다(폴링 없음). */
var state = { items: [], chemCats: {} };
var stateLoaded = false;
var pendingCount = 0; // 서버에 요청이 나가 있는 동안 겹치는 렌더를 막기 위한 카운터
var dirtyFromRealtime = false; // 편집 중이라 화면 반영을 미뤄둔 변경이 있는지

function isEditingNow(){
  var el = document.activeElement;
  if(!el) return false;
  var tag = el.tagName;
  return tag==="INPUT" || tag==="TEXTAREA" || tag==="SELECT";
}

function setBusy(b){
  document.body.classList.toggle("is-busy", !!b);
}

function onServerError(err){
  setBusy(false);
  pendingCount = Math.max(0, pendingCount-1);
  var msg = (err && err.message) ? err.message : "서버와 통신하는 중 문제가 발생했어요.";
  showToast("⚠️ "+msg+" 잠시 후 다시 시도해주세요.");
}

/** 서버(Supabase)에서 최신 상태를 통째로 받아와 로컬 캐시에 반영합니다. */
function refreshState(cb, silent){
  if(!silent) setBusy(true);
  Promise.all([
    sb.from("items").select("*"),
    sb.from("chem_cats").select("*")
  ]).then(function(results){
    var itemsRes = results[0], catsRes = results[1];
    var err = itemsRes.error || catsRes.error;
    if(err){
      if(!silent) setBusy(false);
      if(!silent) onServerError(err);
      return;
    }
    state.items = (itemsRes.data || []).map(function(row){
      return {
        id: row.id, locationId: row.location_id, cabinet: String(row.cabinet),
        name: row.name, qty: (row.qty===null||row.qty===undefined) ? null : Number(row.qty),
        note: row.note || "", example: !!row.example, addedAt: row.added_at
      };
    });
    var cats = {};
    (catsRes.data || []).forEach(function(row){ cats[row.code] = row.cats; });
    state.chemCats = cats;
    stateLoaded = true;
    if(!silent) setBusy(false);
    if(cb) cb();
  }).catch(function(err){
    if(!silent){ setBusy(false); onServerError(err); }
  });
}

/** 서버 쓰기 함수(Postgres RPC) 호출 공통 헬퍼. fnName은 기존 Code.gs 시절 이름 그대로 두고,
    RPC_MAP으로 실제 Supabase 함수 이름/매개변수에 대응시킵니다. */
function callServer(fnName, args, onSuccess){
  setBusy(true);
  pendingCount++;
  var map = RPC_MAP[fnName];
  var rpcName = map ? map.fn : fnName;
  var paramsObj = {};
  if(map){
    map.params.forEach(function(pname, i){ paramsObj[pname] = args[i]; });
  }
  sb.rpc(rpcName, paramsObj).then(function(res){
    pendingCount = Math.max(0, pendingCount-1);
    setBusy(false);
    if(res.error){ onServerError(res.error); return; }
    onSuccess(res.data);
  }).catch(function(err){
    pendingCount = Math.max(0, pendingCount-1);
    setBusy(false);
    onServerError(err);
  });
}

/** 다른 사람의 변경사항을 실시간(Realtime)으로 구독합니다. 폴링(주기적 새로고침) 없이,
    누군가 등록/수정/삭제하면 거의 즉시 이 콜백이 호출됩니다. */
function subscribeRealtime(){
  sb.channel("labinventory-changes")
    .on("postgres_changes", {event:"*", schema:"public", table:"items"}, handleRemoteChange)
    .on("postgres_changes", {event:"*", schema:"public", table:"chem_cats"}, handleRemoteChange)
    .subscribe();
}
function handleRemoteChange(){
  if(pendingCount>0) return; // 내가 쓰는 중이면, 그 응답 쪽에서 곧 화면이 갱신되니 건너뜀
  if(isEditingNow() || currentView==="add" || currentView==="import"){
    dirtyFromRealtime = true; // 입력 중인 내용이 갑자기 사라지지 않도록, 반영을 잠시 미뤄둠
    return;
  }
  refreshState(function(){ renderAll(); }, true);
}
/** 편집을 끝내거나 안전한 화면으로 돌아왔을 때, 미뤄뒀던 실시간 변경사항을 반영합니다. */
function flushDirtyIfSafe(){
  if(!dirtyFromRealtime) return;
  if(isEditingNow() || currentView==="add" || currentView==="import") return;
  dirtyFromRealtime = false;
  refreshState(function(){ renderAll(); }, true);
}

function uid(){ return "it_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); } // 낙관적 임시 id(서버 응답 전 화면용, 실제 저장은 서버가 부여)
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

    '<div class="page-hero-text"><h1 class="page-title">'+title+'</h1><p class="page-sub">'+sub+'</p></div>'+
    (metaHtml?('<div class="page-hero-meta">'+metaHtml+'</div>'):'')+
    '<div class="page-hero-deco">'+(deco||icon)+'</div>'+
    '</div>';
}

}
function metaPillHtml(iconKey, text){
  return '<span class="meta-pill"><span class="ic">'+iconHtml(iconKey)+'</span>'+esc(text)+'</span>';

function itemsFor(locationId){
  return state.items.filter(function(it){ return it.locationId===locationId; });
}
function cabinetsUsed(locationId){
  var set = {};
  itemsFor(locationId).forEach(function(it){ set[it.cabinet]=true; });
  return Object.keys(set).sort(function(a,b){ return (parseInt(a,10)||0)-(parseInt(b,10)||0) || a.localeCompare(b); });
}
function getChemCats(code){
  if(state.chemCats && Array.isArray(state.chemCats[code])) return state.chemCats[code];
  var shelf = chemShelfByCode(code);
  return shelf ? shelf.cats : [];
}

});

/* ---------- Nav ---------- */
function navItems(){
  var items = [{type:"btn", id:"search", ic:iconHtml("search"), icClass:"util-ic", label:"물품 검색"}];
  items.push({type:"label", text:"공간"});
  LOCATIONS.forEach(function(l){
    items.push({type:"btn", id:l.id, ic:iconHtml(l.icon), icClass:(l.hazard?"hazard-ic":""), label:l.name, hazard:l.hazard});
  });
  items.push({type:"label", text:"관리"});
  items.push({type:"btn", id:"add", ic:iconHtml("plus"), icClass:"util-ic", label:"물품 등록"});
  items.push({type:"btn", id:"import", ic:iconHtml("sheet"), icClass:"util-ic", label:"한번에 등록"});
  return items;
}
function navBtnHtml(it){
  return '<button class="navbtn'+(currentView===it.id?" active":"")+(it.hazard?" hazardnav":"")+'" data-nav="'+it.id+'"><span class="ic'+(it.icClass?" "+it.icClass:"")+'">'+it.ic+'</span>'+esc(it.label)+'</button>';
}
function renderNav(){
  var items = navItems();
  document.getElementById("navList").innerHTML = items.map(function(it){
    return it.type==="label" ? '<div class="nav-section-label">'+esc(it.text)+'</div>' : navBtnHtml(it);
  }).join("");
  document.getElementById("mobileTabs").innerHTML = items.filter(function(it){return it.type==="btn";}).map(navBtnHtml).join("");
  document.querySelectorAll("[data-nav]").forEach(function(b){
    b.addEventListener("click", function(){ setView(b.getAttribute("data-nav")); });
  });
}
function renderSideStats(){
  var total = state.items.length;
  var qty = state.items.reduce(function(s,it){ return s+(it.qty||0); },0);
  var cabs = {};
  state.items.forEach(function(it){ cabs[it.locationId+"::"+it.cabinet]=true; });
  document.getElementById("sideStats").innerHTML =
    '<span style="white-space:nowrap;">물품 <b>'+total+'</b>종 · <b>'+qty+'</b>개(수량 확인분)</span>'+
    '<span style="white-space:nowrap;">사용 수납장 <b>'+Object.keys(cabs).length+'</b>곳</span>';
}

function setView(v){
  currentView = v;
  renderNav();
  try{ localStorage.setItem(VIEW_KEY, v); }catch(e){}
  var topSearchbar = document.getElementById("topSearchbar");
  if(topSearchbar) topSearchbar.hidden = (v!=="search");
  if(v!=="add" && v!=="import" && dirtyFromRealtime){
    dirtyFromRealtime = false;
    refreshState(function(){ renderAll(); }, true);
    return;
  }
  render();
}
function render(){
  if(!stateLoaded) return;
  var host = document.getElementById("mainView");
  if(currentView==="search") return renderSearch(host);
  if(currentView==="add") return renderAdd(host);
  if(currentView==="import") return renderImport(host);
  if(LOCATION_IDS.indexOf(currentView)>-1) return renderLocationPage(host, currentView);
}
function renderAll(){
  renderSideStats();
  render();
}

/* ---------- shared item chip ---------- */
function bindItemActions(host, afterChange){
  host.querySelectorAll("[data-dec]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-dec");
      callServer("decrementItem", [id], function(res){
        if(!res){ refreshState(function(){ renderAll(); }); return; }
        refreshState(function(){
          renderAll();
          if(res.removed) showToast('"'+res.item.name+'" 다 썼어요 (삭제됨)', true);
          else showToast('"'+res.item.name+'" 1개 사용 처리 (남은 수량 '+res.item.qty+')');
          if(res.removed) lastDeleted = {item:res.item};
          if(afterChange) afterChange();
        });
      });
    });
  });
  host.querySelectorAll("[data-del]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-del");
      callServer("removeItem", [id], function(item){
        if(!item) return;
        lastDeleted = {item:item};
        refreshState(function(){
          renderAll();
          showToast('"'+item.name+'" 전체 삭제됨', true);
          if(afterChange) afterChange();
        });
      });
    });
  });
}

/* ---------- Search view ---------- */
function renderSearchLocFilterOptions(){
  var sel = document.getElementById("searchLocFilter");
  sel.innerHTML = '<option value="">전체 공간</option>' + LOCATIONS.map(function(l){
    return '<option value="'+l.id+'">'+esc(l.name)+'</option>';
  }).join("");
}

function renderSearch(host){
  var q = (document.getElementById("searchInput").value||"").trim().toLowerCase();
  var locFilter = document.getElementById("searchLocFilter").value;

  var results = state.items.filter(function(it){
    if(locFilter && it.locationId!==locFilter) return false;
    if(!q) return true;
    return it.name.toLowerCase().indexOf(q)>-1;
  }).sort(function(a,b){
    if(q){
      var as = a.name.toLowerCase().indexOf(q)===0 ? 0 : 1;
      var bs = b.name.toLowerCase().indexOf(q)===0 ? 0 : 1;
      if(as!==bs) return as-bs;
    }
    var la = LOCATIONS.findIndex(function(l){return l.id===a.locationId;});
    var lb = LOCATIONS.findIndex(function(l){return l.id===b.locationId;});
    if(la!==lb) return la-lb;
    return (parseInt(a.cabinet,10)||0)-(parseInt(b.cabinet,10)||0);
  });

  var exampleCount = state.items.filter(function(it){return it.example;}).length;
  var banner = "";
  if(exampleCount>0){
    banner = '<div class="example-banner"><span>👋 지금 보이는 항목 중 <b class="mono">'+exampleCount+'</b>개는 예시 데이터예요. 구조를 먼저 확인해보세요.</span>'+
      '<button class="btn sm" id="clearExampleBtn">예시 데이터 모두 지우기</button></div>';
  }

  var html = pageHero(iconHtml("search"), (q?('“'+esc(q)+'” 검색 결과'):'물품 검색'), "이름으로 찾으면 어느 공간, 몇 번 수납장에 있는지 보여줘요.", false, "🧭");
  html += banner;

  if(results.length===0){
    html += '<div class="card"><div class="empty-state"><span class="ic">🗄️</span>'+
      (q? '“'+esc(q)+'”와 일치하는 물품이 없어요. 다른 이름으로 찾아보거나, 직접 등록해보세요.' : '아직 등록된 물품이 없어요. “물품 등록”에서 추가해보세요.')+
      '</div></div>';
  } else {
    html += '<div class="card result-list">' + results.map(renderResultRow).join("") + '</div>';
  }
  host.innerHTML = html;

  var clearBtn = document.getElementById("clearExampleBtn");
  if(clearBtn) clearBtn.addEventListener("click", function(){
    callServer("clearExampleItems", [], function(){
      refreshState(function(){
        renderAll();
        showToast("예시 데이터를 모두 지웠어요.");
      });
    });
  });
  bindItemActions(host);
  bindGotoLinks(host);
}

function bindGotoLinks(host){
  host.querySelectorAll("[data-goto-loc]").forEach(function(b){
    b.addEventListener("click", function(){
      var locId = b.getAttribute("data-goto-loc");
      var cab = b.getAttribute("data-goto-cab");
      jumpValues[locId] = cab;
      setView(locId);
    });
  });
}

function renderResultRow(it){
  var l = loc(it.locationId);
  var hazardCls = l.hazard ? " hazard" : "";
  var cabLabel = l.chemCabinet ? esc(it.cabinet) : (esc(it.cabinet)+"번");
  return '<div class="result-row" data-item="'+it.id+'">'+
    '<button type="button" class="badge-link" data-goto-loc="'+it.locationId+'" data-goto-cab="'+esc(it.cabinet)+'" title="이 위치로 이동">'+
      '<span class="badge'+hazardCls+'">'+esc(l.short)+'</span>'+
      '<span class="badge num">'+cabLabel+'</span>'+
    '</button>'+
    '<span class="result-name">'+esc(it.name)+'</span>'+
    (it.qty!=null?'<span class="result-note mono">×'+it.qty+'</span>':'')+
    (it.note?'<span class="result-note">'+esc(it.note)+'</span>':'')+
    (it.example?'<span class="badge example">예시</span>':'')+
    '<span class="result-spacer"></span>'+
    (it.qty!=null?'<button class="btn sm" data-dec="'+it.id+'">1개 사용</button>':'')+
    '<button class="btn sm danger-ghost" data-del="'+it.id+'">전체 삭제</button>'+
    '</div>';
}

/* ---------- Cabinet items table (2-column layout) ---------- */

function cabTableColHtml(rows){
  if(!rows.length) return '';
  return '<div class="cab-table-col"><table class="cab-table"><thead><tr><th>번호</th><th>품목명</th><th>개수</th><th></th></tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
}
function cabItemsTableHtml(its){
  if(its.length===0) return '<div class="cab-empty-note">등록된 물품이 없어요.</div>';
  var rows = its.map(function(it,i){ return cabTableRowHtml(it, i+1); });
  var half = Math.ceil(rows.length/2);
  return '<div class="cab-tables">'+cabTableColHtml(rows.slice(0,half))+cabTableColHtml(rows.slice(half))+'</div>';
}
function bindQtyEdits(host){
  host.querySelectorAll("[data-qtyedit]").forEach(function(inp){
    inp.addEventListener("change", function(){
      var id = inp.getAttribute("data-qtyedit");
      var val = inp.value;
      callServer("setItemQty", [id, val], function(res){
        if(!res){ refreshState(function(){ renderAll(); }); return; }
        refreshState(function(){
          renderAll();
          if(res.removed) showToast('"'+res.item.name+'" 개수가 0이 되어 삭제됐어요', true);
          else showToast('"'+res.item.name+'" 개수를 '+res.item.qty+'개로 변경했어요');
          if(res.removed) lastDeleted = {item:res.item};
        });
      });
    });
  });
  host.querySelectorAll("[data-qtystep]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-qtystep");
      var dir = parseInt(b.getAttribute("data-dir"),10);
      var it = state.items.find(function(x){ return x.id===id; });
      if(!it || it.qty==null) return;
      callServer("setItemQty", [id, it.qty+dir], function(res){
        if(!res){ refreshState(function(){ renderAll(); }); return; }
        refreshState(function(){
          renderAll();
          if(res.removed) showToast('"'+res.item.name+'" 개수가 0이 되어 삭제됐어요', true);
          else showToast('"'+res.item.name+'" 개수를 '+res.item.qty+'개로 변경했어요');
          if(res.removed) lastDeleted = {item:res.item};
        });
      });
    });
  });
}

/* ---------- 약품장 diagram (shelf map) ---------- */
var CHEM_TIERS = [{id:"상", label:"상단 (위)"},{id:"하", label:"하단 (아래)"}];
function chemCabinetBlockHtml(cabinetId, title, colorClass, matchedCodes, locId){
  var tiersHtml = CHEM_TIERS.map(function(t){
    var rows = CHEM_SHELVES.filter(function(s){ return s.cabinet===cabinetId && s.tier===t.id; })
      .sort(function(a,b){ return a.row-b.row; });
    var rowsHtml = rows.map(function(s){
      var its = itemsFor(locId).filter(function(it){ return it.cabinet===s.code; });
      var cnt = its.length;
      var cls = "chem-shelf-row"+(cnt>0?" has-items":"")+(matchedCodes.indexOf(s.code)>-1?" highlight":"");
      var catsLine = getChemCats(s.code).join(" · ");
      var bodyInner;
      if(cnt>0){
        bodyInner = '<div class="chem-cats-mini">'+esc(catsLine)+'</div>'+
          '<div class="chem-shelf-items">'+its.map(function(it){
            return '<span class="chem-shelf-item">'+esc(it.name)+(it.qty!=null?'<span class="chem-shelf-item-qty">×'+it.qty+'</span>':'')+'</span>';
          }).join('')+'</div>';
      } else {
        bodyInner = '<div class="chem-cats-empty">'+esc(catsLine)+'</div>';
      }
      return '<div class="'+cls+'" data-shelfcode="'+esc(s.code)+'" title="'+esc(s.code)+' 물품 보기">'+
        '<div class="chem-shelf-code">'+esc(s.code)+(cnt>0?'<span class="chem-count">'+cnt+'</span>':'')+'</div>'+
        '<div class="chem-shelf-body">'+bodyInner+'</div>'+
        '</div>';
    }).join("");
    return '<div class="chem-tier"><div class="chem-tier-label">'+esc(t.label)+'</div><div class="chem-tier-rows">'+rowsHtml+'</div></div>';
  }).join("");
  return '<div class="chem-cabinet '+colorClass+'"><div class="chem-cabinet-title">'+esc(title)+'</div>'+tiersHtml+'</div>';
}
function renderChemDiagram(locId, matchedCodes){
  return '<div class="chem-diagram-wrap card">'+
    '<h2 class="chem-diagram-title">🗺️ 약품장 지도</h2>'+
    '<p class="chem-diagram-sub">칸을 클릭하면 아래에서 그 칸의 물품을 바로 확인하고 관리할 수 있어요.</p>'+
    '<div class="chem-diagram">'+
      chemCabinetBlockHtml("1","1번 약품장","c1",matchedCodes,locId)+
      chemCabinetBlockHtml("2","2번 약품장","c2",matchedCodes,locId)+
    '</div></div>';
}
function fitChemItemText(host){
  var els = host.querySelectorAll(".chem-shelf-item");
  els.forEach(function(el){
    el.style.fontSize = "";
    var size = 11;
    var minSize = 7.5;
    var guard = 0;
    while(el.scrollWidth > el.clientWidth + 1 && size > minSize && guard < 20){
      size -= 0.5;
      el.style.fontSize = size + "px";
      guard++;
    }
  });
}

/* ---------- Location page (all cabinets shown at once, card+table style) ---------- */
function cabListFor(locId){
  var l = loc(locId);
  if(l.chemCabinet){
    return CHEM_SHELVES.map(function(s){
      return {code:s.code, count:itemsFor(locId).filter(function(it){ return it.cabinet===s.code; }).length};
    });
  }
  return cabinetsUsed(locId).map(function(c){
    return {code:c, count:itemsFor(locId).filter(function(it){ return String(it.cabinet)===c; }).length};
  });
}
function cabSectionHtml(l, locId, code, isChem){
  var its = itemsFor(locId).filter(function(it){ return String(it.cabinet)===code; });
  var label = isChem ? code : (code+"번");
  var boxLabel = isChem ? "보관 칸" : "수납장";
  var toneClass = l.tone ? (" tone-"+l.tone) : "";
  var settingsOpen = !!chemSettingsOpen[code];
  var catsHtml = "";
  if(isChem){
    var cats = getChemCats(code);
    if(settingsOpen){
      catsHtml = '<div class="cab-detail-cats cab-detail-cats-edit">'+
        '<div class="cat-chip-row">'+
          cats.map(function(c,i){
            return '<span class="cat-chip">'+esc(c)+'<button type="button" class="cat-chip-del" data-catdel="'+esc(code)+'" data-catidx="'+i+'" title="이 칸 삭제">×</button></span>';
          }).join('')+
        '</div>'+
        '<form class="cat-add-form" data-cataddform="'+esc(code)+'">'+
          '<input type="text" class="cat-add-input" placeholder="칸 추가 (예: 산류)" maxlength="20">'+
          '<button type="submit" class="cat-add-btn">'+iconHtml("plus")+' 칸추가</button>'+
        '</form>'+
      '</div>';
    } else {
      catsHtml = '<div class="cab-detail-cats">'+
        cats.map(function(c){ return '<span class="cat-chip-static">'+esc(c)+'</span>'; }).join('')+
      '</div>';
    }
  }
  var settingsBtn = isChem
    ? '<button type="button" class="cab-settings-btn" data-cabsettings="'+esc(code)+'">'+iconHtml("gear")+' '+(settingsOpen?"칸 설정 닫기":"칸 설정")+'</button>'
    : '';
  return '<div class="cab-card'+(l.hazard?" hazard":"")+'">'+

      '<div class="cab-card-info'+(l.hazard?" hazard":"")+toneClass+'">'+
        '<div class="cab-card-info-icon">'+iconHtml(l.icon)+'</div>'+
        '<div class="cab-card-info-label">'+boxLabel+'</div>'+
        '<div class="cab-card-info-num">'+esc(label)+'</div>'+
        catsHtml+
        '<div class="cab-card-info-divider"></div>'+
        '<div class="cab-card-info-row"><span class="ic">'+iconHtml("box")+'</span>물품 수 <b>'+its.length+'</b>개</div>'+
        '<div class="cab-card-info-row"><span class="status-dot'+(its.length>0?" on":"")+'"></span>'+(its.length>0?"사용 중":"비어있음")+'</div>'+

function renderLocationPage(host, locId){
  var l = loc(locId);
  var isChem = !!l.chemCabinet;
  var hazardNote = l.hazard ? '<div class="hazard-note">⚠️ 약품은 사용 후 반드시 원래 번호 자리에 반납하고, 새 약품을 넣을 때는 라벨과 유효기간을 확인하세요.</div>' : "";

  var cabs = cabListFor(locId);
  var jumpVal = (jumpValues[locId]||"").trim();
  var jumpPlaceholder = isChem ? "번호 또는 물품명으로 찾기" : "번호로 찾기 (예: 1, 2, 3…)";

  var shownCabs = cabs;
  if(jumpVal){
    if(isChem){
      shownCabs = cabs.filter(function(c){ return chemMatchesQuery(chemShelfByCode(c.code), locId, jumpVal); });
    } else {
      var q = jumpVal.toLowerCase();
      shownCabs = cabs.filter(function(c){
        if(c.code.indexOf(jumpVal)===0) return true;
        return itemsFor(locId).some(function(it){ return String(it.cabinet)===c.code && it.name.toLowerCase().indexOf(q)>-1; });
      });
    }
  }

  var filterVal = cabFilterValues[locId] || "all";
  if(filterVal==="used") shownCabs = shownCabs.filter(function(c){ return c.count>0; });
  else if(filterVal==="empty") shownCabs = shownCabs.filter(function(c){ return c.count===0; });

  var FILTERS = [{v:"all",label:"전체 보기"},{v:"used",label:"사용 중"},{v:"empty",label:"비어있는 수납장"}];
  var searchCard =
    '<div class="card search-card">'+
      '<div class="search-row">'+
        '<div class="search-input-wrap">'+
          '<span class="ic">'+iconHtml("search")+'</span>'+
          '<input type="text" id="jumpInput" placeholder="'+esc(jumpPlaceholder)+'" value="'+esc(jumpVal)+'">'+
        '</div>'+
        '<button type="button" class="btn primary search-btn" id="jumpGoBtn">'+iconHtml("search")+' 검색</button>'+
      '</div>'+
      '<div class="filter-row">'+
        FILTERS.map(function(f){
          return '<button type="button" class="filter-chip'+(filterVal===f.v?" active":"")+'" data-cabfilter="'+f.v+'">'+esc(f.label)+'</button>';
        }).join('')+
      '</div>'+
    '</div>';

  var newCabBox =
    '<div class="new-cab-box" id="goAddBtn">'+
      '<div class="new-cab-icon">'+iconHtml("plus")+'</div>'+
      '<div class="new-cab-title">새 수납장에 물품 등록</div>'+
      '<div class="new-cab-sub">새로운 수납장을 추가하여 물품을 등록할 수 있습니다.</div>'+
    '</div>';

  var bodyHtml;
  if(isChem){
    var showDetail = !!jumpVal || filterVal!=="all";
    var matchedCodes = showDetail ? shownCabs.map(function(c){ return c.code; }) : [];
    var gridHtml = renderChemDiagram(locId, matchedCodes);
    var detailHtml;
    if(showDetail && shownCabs.length>0){
      detailHtml = '<div class="cab-cards-list">' + shownCabs.map(function(c){ return cabSectionHtml(l, locId, c.code, isChem); }).join('') + '</div>';
    } else if(showDetail){
      var chemEmptyMsg = jumpVal ? ('"'+esc(jumpVal)+'"와 일치하는 칸이 없어요.') : "조건에 맞는 칸이 없어요.";
      detailHtml = '<div class="cab-picker-empty">'+chemEmptyMsg+'</div>';
    } else {
      detailHtml = '<div class="chem-grid-hint">'+iconHtml("flask")+'<span>칸을 클릭하면 그 칸의 물품을 바로 확인하고 관리할 수 있어요.</span></div>';
    }
    bodyHtml = gridHtml + detailHtml + newCabBox;
  } else if(cabs.length===0){
    bodyHtml = '<div class="new-cab-box" id="goAddBtn">'+
      '<div class="new-cab-icon">'+iconHtml("plus")+'</div>'+
      '<div class="new-cab-title">'+esc(l.name)+'에 첫 물품 등록하기</div>'+
      '<div class="new-cab-sub">아직 등록된 수납장이 없어요. 눌러서 물품을 등록해보세요.</div>'+
    '</div>';
  } else if(shownCabs.length===0){
    var emptyMsg = (filterVal==="empty")
      ? "이 공간은 물품이 있는 수납장만 표시돼요. 비어있는 수납장은 따로 관리되지 않아요."
      : (jumpVal ? ('"'+esc(jumpVal)+'"와 일치하는 수납장이 없어요.') : "조건에 맞는 수납장이 없어요.");
    bodyHtml = '<div class="cab-picker-empty">'+emptyMsg+'</div>';
  } else {
    bodyHtml = '<div class="cab-cards-list">' + shownCabs.map(function(c){ return cabSectionHtml(l, locId, c.code, isChem); }).join('') + '</div>'+
      newCabBox;
  }

  host.innerHTML =
    pageHero(iconHtml(l.icon), esc(l.name), "수납장 번호별로 물품이 정리되어 있어요. 칸에서 직접 수량을 바꾸고, 다 쓴 물품은 ✕ 를 눌러주세요.", l.hazard, null,
      metaPillHtml("calendar", todayKoreanStr())+metaPillHtml(l.icon, l.name))+
    hazardNote+
    searchCard+
    bodyHtml;

  if(isChem) fitChemItemText(host);

  var jumpEl = document.getElementById("jumpInput");
  var jumpGoBtn = document.getElementById("jumpGoBtn");
  function doJump(){
    jumpValues[locId] = jumpEl.value;
    renderLocationPage(host, locId);
  }
  if(jumpEl) jumpEl.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); doJump(); } });
  if(jumpGoBtn) jumpGoBtn.addEventListener("click", doJump);

  host.querySelectorAll("[data-cabfilter]").forEach(function(b){
    b.addEventListener("click", function(){
      cabFilterValues[locId] = b.getAttribute("data-cabfilter");
      renderLocationPage(host, locId);
    });
  });

  if(isChem){
    host.querySelectorAll("[data-shelfcode]").forEach(function(b){
      b.addEventListener("click", function(){
        jumpValues[locId] = b.getAttribute("data-shelfcode");
        renderLocationPage(host, locId);
      });
    });
    host.querySelectorAll("[data-catdel]").forEach(function(b){
      b.addEventListener("click", function(){
        var code = b.getAttribute("data-catdel");
        var idx = parseInt(b.getAttribute("data-catidx"),10);
        callServer("removeChemCatAt", [code, idx], function(cats){
          state.chemCats[code] = cats;
          renderLocationPage(host, locId);
          refreshState(function(){ /* 다른 사람 변경분까지 조용히 함께 반영 */ }, true);
        });
      });
    });
    host.querySelectorAll("[data-cataddform]").forEach(function(f){
      f.addEventListener("submit", function(e){
        e.preventDefault();
        var code = f.getAttribute("data-cataddform");
        var input = f.querySelector(".cat-add-input");
        var text = input ? input.value : "";
        callServer("addChemCat", [code, text], function(res){
          if(res.added){
            state.chemCats[code] = res.cats;
            renderLocationPage(host, locId);
          } else if(input){ input.value=""; input.focus(); }
        });
      });
    });
    host.querySelectorAll("[data-cabsettings]").forEach(function(b){
      b.addEventListener("click", function(){
        var code = b.getAttribute("data-cabsettings");
        chemSettingsOpen[code] = !chemSettingsOpen[code];
        renderLocationPage(host, locId);
      });
    });
  }

  host.querySelectorAll("[data-cabadd]").forEach(function(b){
    b.addEventListener("click", function(){
      currentAddLoc = locId;
      pendingAddCabinet = b.getAttribute("data-cabadd");
      setView("add");
    });
  });
  var goAddBtns = host.querySelectorAll("#goAddBtn");
  goAddBtns.forEach(function(b){
    b.addEventListener("click", function(){
      currentAddLoc = locId;
      pendingAddCabinet = "";
      setView("add");
    });
  });

  bindItemActions(host, function(){ /* re-render handled by renderAll -> render() */ });
  bindQtyEdits(host);
}

      '<div class="field full"><label for="addName">물품명</label>'+

      '<div class="field"><label for="addNote">비고 (선택)</label>'+
        '<input id="addNote" type="text" placeholder="예: 유효기간 2027.03"></div>'+
      '<div class="form-actions">'+
        '<button type="submit" class="btn primary">등록하기</button>'+

    '<p class="footnote">공간과 번호는 그대로 두고 물품명만 바꿔서 계속 등록하면, 한 수납장을 정리할 때 빠르게 여러 개를 넣을 수 있어요.</p>';

          setTimeout(function(){ msg.style.display="none"; }, 4000);

/* ---------- Import view ---------- */
function extractQty(nameRaw){
  var s = nameRaw.trim();
  var patterns = [
    /^(.*?)\s*[x×]\s*(\d+)\s*(개|EA|ea)?$/i,
    /^(.*?)\s*\(\s*(\d+)\s*개?\s*\)$/,
    /^(.*?)\s+(\d+)\s*개$/,
    /^(.*?)\s+(\d+)$/
  ];
  for(var i=0;i<patterns.length;i++){
    var m = s.match(patterns[i]);
    if(m && m[1] && m[1].trim()){
      return {name:m[1].trim(), qty:parseInt(m[2],10)};
    }
  }
  return {name:s, qty:null};
}

var EXAMPLE_TUPLES = [
  {cab:"1", name:"비커(500mL)"},
  {cab:"2", name:"온도계"},
  {cab:"1-상-1", name:"염산(HCl) 0.1M"},
  {cab:"1-하-2", name:"에탄올"}
];
function isTemplateExample(cab, name){
  return EXAMPLE_TUPLES.some(function(ex){ return ex.cab===cab && ex.name===name; });
}
function matchLocationBySheetName(sheetName){
  var t = String(sheetName||"").trim();
  for(var i=0;i<LOCATIONS.length;i++){ if(LOCATIONS[i].name===t || LOCATIONS[i].short===t) return LOCATIONS[i]; }
  for(var j=0;j<LOCATIONS.length;j++){ if(t.indexOf(LOCATIONS[j].short)>-1) return LOCATIONS[j]; }
  return null;
}
function cellQty(cellVal, fallback){
  var s = String(cellVal==null?"":cellVal).trim();
  if(s==="") return fallback;
  var n = parseInt(s,10);
  return (isNaN(n)||n<=0) ? fallback : n;
}
function parseExcelWorkbook(wb){
  var rows = [];
  var unmatched = [];
  var BLOCK_STARTS = [0]; // 0-indexed column of the block's 수납장번호 cell (A) — single-block layout
  wb.SheetNames.forEach(function(sn){
    if(/^(안내|가이드|설명)$/.test(String(sn).trim())) return;
    var l = matchLocationBySheetName(sn);
    if(!l){ unmatched.push(sn); return; }
    var sheet = wb.Sheets[sn];
    var aoa = XLSX.utils.sheet_to_json(sheet, {header:1, defval:""});
    aoa.forEach(function(row){
      BLOCK_STARTS.forEach(function(base){
        var cab = String(row[base]==null?"":row[base]).trim();
        var rawName = String(row[base+1]==null?"":row[base+1]).trim();
        var note = String(row[base+3]==null?"":row[base+3]).trim();
        if(!cab || !rawName) return;
        if(cab.replace(/\s/g,"")==="수납장번호" || rawName==="품목명") return;
        if(isTemplateExample(cab, rawName)) return;
        var ex = extractQty(rawName);
        var qty = cellQty(row[base+2], ex.qty);
        rows.push({loc:l.id, cab:cab, name:ex.name, qty:qty, note:note});
      });
    });
  });
  return {rows:rows, unmatched:unmatched};
}

var TEMPLATE_FILENAME = "과학실_수납장_물품등록_양식.xlsx";
var TEMPLATE_MIME = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";

function templateB64ToBlob(){
  var bin = atob(TEMPLATE_XLSX_B64);
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++){ bytes[i] = bin.charCodeAt(i); }
  return new Blob([bytes], {type:TEMPLATE_MIME});
}

function triggerPlainDownload(){
  var a = document.createElement("a");
  a.href = "data:"+TEMPLATE_MIME+";base64,"+TEMPLATE_XLSX_B64;
  a.download = TEMPLATE_FILENAME;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function handleTemplateDownload(statusEl){
  try{
    triggerPlainDownload();
  }catch(e){
    if(statusEl) statusEl.textContent = "다운로드에 실패했어요. 페이지를 새로고침한 뒤 다시 시도해주세요.";
  }
}

function renderImport(host){
  host.innerHTML =
    pageHero(iconHtml("sheet"), "엑셀로 한번에 등록", "양식을 받아 채운 뒤 올리면, 시트 이름으로 공간을 자동 구분해서 한번에 등록해요.", false, "🗃️")+
    '<div class="card">'+
      '<div class="import-body">'+
        '<ol class="steps">'+
          '<li><button type="button" class="btn primary" id="templateDownloadBtn">⬇ 엑셀 양식 다운로드</button></li>'+
          '<li>양식을 열어 시트별로 수납장번호·품목명·개수(선택: 비고)를 채워주세요. 개수를 모르면 비워두면 돼요. 시트 이름은 바꾸지 마세요.</li>'+
          '<li>채운 파일을 아래에 올리면 자동으로 표가 만들어져요.</li>'+
        '</ol>'+
        '<div class="dropzone">📊 채운 엑셀 파일(.xlsx)을 선택하세요.<br>'+
        '<input type="file" id="xlsxFile" accept=".xlsx"></div>'+
        '<p class="footnote" style="padding:0;" id="xlsxStatus"></p>'+
        '<div id="parseResultXlsx"></div>'+
      '</div>'+
    '</div>';

  document.getElementById("templateDownloadBtn").addEventListener("click", function(){
    handleTemplateDownload(document.getElementById("xlsxStatus"));
  });

  document.getElementById("xlsxFile").addEventListener("change", function(e){
    var f = e.target.files[0];
    if(!f) return;
    var statusEl = document.getElementById("xlsxStatus");
    statusEl.textContent = "엑셀 읽는 중…";
    if(!window.XLSX){
      statusEl.textContent = "엑셀 인식 도구를 불러오지 못했어요. 페이지를 새로고침한 뒤 다시 시도해주세요.";
      return;
    }
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var wb = XLSX.read(new Uint8Array(reader.result), {type:"array"});
        var parsed = parseExcelWorkbook(wb);
        parsedRows = parsed.rows.map(function(r,i){ return {rowId:"r"+i, loc:r.loc, cab:r.cab, name:r.name, qty:r.qty, note:r.note}; });
        if(parsed.unmatched.length){
          statusEl.textContent = "일부 시트는 공간 이름과 맞지 않아 건너뛰었어요: "+parsed.unmatched.join(", ");
        } else {
          statusEl.textContent = "엑셀에서 "+parsedRows.length+"건을 읽었어요. 아래 표에서 확인하고 등록하세요.";
        }
        renderParsePreview("parseResultXlsx", []);
      }catch(err){
        statusEl.textContent = "엑셀 파일을 읽는 데 실패했어요. 양식을 그대로 사용했는지 확인해주세요.";
      }
    };
    reader.readAsArrayBuffer(f);
  });
}

function renderParsePreview(resultHostId, fails){
  var el = document.getElementById(resultHostId);
  if(parsedRows.length===0){
    el.innerHTML = '<div class="empty-state" style="padding:24px;">인식된 항목이 없어요. 줄마다 "번호 물품명" 형식인지 확인해보세요.</div>';
    return;
  }
  var rowsHtml = parsedRows.map(function(r){
    return '<tr data-row="'+r.rowId+'">'+
      '<td><select data-field="loc">'+LOCATIONS.map(function(x){return '<option value="'+x.id+'"'+(x.id===r.loc?" selected":"")+'>'+esc(x.short)+'</option>';}).join("")+'</select></td>'+
      '<td><input class="num-col mono" data-field="cab" value="'+esc(r.cab)+'"></td>'+
      '<td><input data-field="name" value="'+esc(r.name)+'"></td>'+
      '<td><input class="qty-col mono" type="number" min="1" placeholder="미상" data-field="qty" value="'+(r.qty==null?"":r.qty)+'"></td>'+
      '<td><input data-field="note" value="'+esc(r.note||"")+'" placeholder="비고"></td>'+
      '<td><button class="btn sm danger-ghost" data-removerow="'+r.rowId+'">제외</button></td>'+
      '</tr>';
  }).join("");
  el.innerHTML =
    '<div class="preview-wrap"><table class="preview-table"><thead><tr><th>공간</th><th>번호</th><th>물품명</th><th>수량(비우면 미상)</th><th>비고</th><th></th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div>'+
    (fails && fails.length ? '<p class="parse-fail" style="margin-top:10px;">인식하지 못한 줄 '+fails.length+'개는 제외됐어요: '+esc(fails.slice(0,3).join(" / "))+(fails.length>3?" …":"")+'</p>' : '')+
    '<div style="margin-top:12px;"><button class="btn primary" id="commitImportBtn">등록하기 ('+parsedRows.length+'건)</button></div>';

  el.querySelectorAll("[data-field]").forEach(function(inp){
    var evt = inp.tagName==="SELECT" ? "change" : "input";
    inp.addEventListener(evt, function(){
      var rowId = inp.closest("tr").getAttribute("data-row");
      var row = parsedRows.find(function(r){return r.rowId===rowId;});
      if(!row) return;
      var f = inp.getAttribute("data-field");
      if(f==="qty") row.qty = inp.value.trim()==="" ? null : (parseInt(inp.value,10)||null);
      else row[f] = inp.value;
    });
  });
  el.querySelectorAll("[data-removerow]").forEach(function(b){
    b.addEventListener("click", function(){
      var rowId = b.getAttribute("data-removerow");
      parsedRows = parsedRows.filter(function(r){return r.rowId!==rowId;});
      renderParsePreview(resultHostId, []);
    });
  });
  document.getElementById("commitImportBtn").addEventListener("click", function(){
    var commitBtn = document.getElementById("commitImportBtn");
    if(commitBtn){ commitBtn.disabled = true; commitBtn.textContent = "등록하는 중…"; }
    var rows = parsedRows.map(function(r){ return {loc:r.loc, cab:r.cab, name:r.name, qty:r.qty, note:r.note||""}; });
    callServer("bulkAddItems", [rows], function(res){
      parsedRows = [];
      refreshState(function(){
        renderAll();
        var locKeys = res.locsUsed || [];
        showToast(res.count+"건 등록했어요"+(locKeys.length===1 ? " ("+loc(locKeys[0]).name+")" : locKeys.length>1 ? " ("+locKeys.length+"개 공간)" : "")+".");
        setView(locKeys.length===1 ? locKeys[0] : "search");
      });
    });
  });
}

/* ---------- wiring ---------- */
document.getElementById("searchInput").addEventListener("input", function(){ if(currentView==="search") render(); });
document.getElementById("searchLocFilter").addEventListener("change", function(){ if(currentView==="search") render(); });

function boot(){
  var logoImg = document.getElementById("brandLogoImg");
  if(logoImg) logoImg.src = "data:image/png;base64,"+SCHOOL_LOGO_B64;
  renderSearchLocFilterOptions();

  refreshState(function(){
    renderSideStats();
    var savedView = "search";
    try{ savedView = localStorage.getItem(VIEW_KEY) || "search"; }catch(e){}
    setView(savedView);
    subscribeRealtime();
    document.addEventListener("focusout", function(){ setTimeout(flushDirtyIfSafe, 50); });
  });
}

boot();

})();
